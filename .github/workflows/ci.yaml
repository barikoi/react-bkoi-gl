name: CI

# Minimal gate (barikoiapis-golang pattern): one job, one Node version,
# lint + unit tests. Browser tests, e2e, build, and the pack gate run
# locally and are enforced by `prepublishOnly` before publishing.
on:
  push:
    # TEST: maplibre-v6.6.0 added so the workflow runs on this branch — remove after merge
    branches: [master, maplibre-v6.6.0]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is gitignored by policy, so setup-node's cache (which
      # requires a lockfile) can't be used — cache the npm tarball store keyed
      # on package.json instead. Cold install ~1m; cached ~20-30s.
      - name: Cache npm tarballs
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Unit project only (jsdom, mocked engine) — no Playwright download
      - name: Unit tests
        run: npx vitest run --project unit
