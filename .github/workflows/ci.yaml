name: CI

# Minimal gate (barikoiapis-golang pattern): one job, one Node version,
# lint + unit tests. Browser tests, e2e, build, and the pack gate run
# locally and are enforced by `prepublishOnly` before publishing.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is gitignored by policy; plain install resolves from package.json exact pins
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Unit project only (jsdom, mocked engine) — no Playwright download
      - name: Unit tests
        run: npx vitest run --project unit
