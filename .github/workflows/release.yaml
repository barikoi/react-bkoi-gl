# Single CI/CD workflow for react-bkoi-gl — NO npm publishing.
# On every push to master and every PR:
#   - CodeQL security scanning (parallel job),
#   - the remote half of the gate: typecheck, lint, unit tests with coverage
#     (uploaded to Codecov), build, README example check, pack smoke test.
# Additionally, on pushes to master only, the gate job:
#   1. regenerates the two local README badge SVGs from build metrics
#      (bundle size via `npm run build`; engine version from the lockfile)
#      and commits them back with [skip ci],
#   2. extracts the top CHANGELOG.md entry (scripts/extract-changelog.mjs)
#      and creates or updates the v<x.y.z> GitHub Release with that section as
#      notes (an existing release's body is refreshed, so later CHANGELOG
#      edits reach the published release).
# The changelog is the source of truth for the version; a CHANGELOG ⇄
# package.json version mismatch fails the run.

name: Release

on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  codeql:
    name: CodeQL analysis
    permissions:
      security-events: write
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  gate:
    name: Typecheck, lint, test, build, release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: npm run typecheck && npm run lint

      - name: Unit tests with coverage
        run: npx vitest run --project unit --coverage

      # Token optional for public repos; set CODECOV_TOKEN if the org
      # requires token-authenticated uploads.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: npm run build

      - name: README example check
        run: node scripts/check-readme-examples.mjs && tsc -p tmp/readme-examples/tsconfig.json

      - name: Pack tarball smoke test
        run: npm run test:pack

      # ---- push to master only: badges + GitHub Release ----

      - name: Commit refreshed badges
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- '*-badge.svg'
          if git diff --cached --quiet; then
            echo 'Badges unchanged — nothing to commit'
          else
            git commit -m 'chore(badges): regenerate from CI metrics [skip ci]'
            git push
          fi

      - name: Extract version and release notes from CHANGELOG
        if: github.event_name == 'push'
        id: changelog
        run: node scripts/extract-changelog.mjs

      - name: Check version matches package.json
        if: github.event_name == 'push'
        run: |
          VERSION='${{ steps.changelog.outputs.version }}'
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "ERROR: CHANGELOG version ($VERSION) != package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.changelog.outputs.version }}
          name: v${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
