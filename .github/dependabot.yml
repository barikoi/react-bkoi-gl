# Dependabot policy: low-noise.
#
# - One combined PR per ecosystem per month (all update types grouped),
#   capped at 1 open PR per ecosystem — merge or close at leisure.
# - PRs target the "deps" branch, never master directly; review warnings
#   manually and merge to master only when you choose.
# - tests/framework/ is excluded: consumer repro apps intentionally pin old
#   framework versions (react-scripts 5, Next 13/14, Vite 5/6) for
#   compatibility testing of the built library.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: "deps"
    exclude-paths:
      - "tests/framework"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "deps"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    groups:
      all:
        update-types: ["major", "minor", "patch"]
